<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GlobeTrotter Trip Details — Multi-city destination itinerary, city stops, and trip summary experience."/>
  <title>Trip Summary & Destinations — GlobeTrotter</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .details-wrapper {
      max-width: 1000px;
      margin: 36px auto 80px;
      padding: 0 24px;
    }

    .top-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--primary); }

    /* Trip Header Banner */
    .trip-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
    }
    .trip-banner::after {
      content: '✈️';
      position: absolute; right: 24px; bottom: 10px;
      font-size: 7rem; opacity: 0.12; pointer-events: none;
    }

    .banner-meta {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap;
    }

    .trip-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; }

    .trip-info-pills {
      display: flex; gap: 20px; flex-wrap: wrap;
      color: var(--muted); font-size: 0.9rem; margin-top: 16px;
    }
    .info-pill { display: flex; align-items: center; gap: 6px; }

    /* ── Executive Trip Summary Experience (M3 Turn 5) ── */
    .summary-card {
      background: linear-gradient(135deg, rgba(15,23,42,.9) 0%, rgba(30,41,59,.75) 100%);
      border: 1px solid rgba(56,189,248,.35);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 32px;
      box-shadow: 0 12px 36px rgba(0,0,0,.45);
    }
    .summary-card-header {
      font-size: 1.15rem; font-weight: 800; color: #ffffff;
      margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .summary-item {
      background: rgba(15,23,42,.65); border: 1px solid var(--border);
      padding: 14px 18px; border-radius: 14px;
    }
    .summary-label { font-size: 0.74rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.6px; margin-bottom: 4px; }
    .summary-value { font-size: 1.25rem; font-weight: 800; color: #f8fafc; }
    .summary-value.green { color: var(--success); }
    .summary-value.cyan  { color: var(--primary); }

    .destination-journey-box {
      background: rgba(15,23,42,.8); border: 1px solid var(--border);
      padding: 18px 22px; border-radius: 14px;
    }
    .journey-flow {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px;
    }
    .journey-stop-pill {
      background: var(--surface); border: 1px solid rgba(56,189,248,.3);
      padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 0.88rem;
      color: #f8fafc; display: inline-flex; align-items: center; gap: 6px;
    }
    .journey-arrow { color: var(--primary); font-weight: 800; font-size: 1.1rem; }

    .description-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
    }
    .description-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
    .description-card p  { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }

    /* ── Trip → Stop → Activities Architecture ── */
    .dest-section { margin-bottom: 40px; }
    .section-title {
      font-size: 1.3rem; font-weight: 700; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .stops-container {
      display: flex; flex-direction: column; gap: 24px;
    }

    .stop-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      transition: border-color var(--transition);
    }
    .stop-block:hover { border-color: rgba(56,189,248,.4); }

    .stop-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 18px; border-bottom: 1px solid var(--border);
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }

    .stop-header-info { display: flex; align-items: center; gap: 14px; }
    .stop-badge {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(56,189,248,.12); color: var(--primary);
      font-weight: 800; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(56,189,248,.3); flex-shrink: 0;
    }

    .city-heading { font-size: 1.4rem; font-weight: 800; color: #f8fafc; }
    .stop-dates-sub { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-top: 2px; }

    .stop-header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-icon {
      padding: 5px 10px; font-size: 0.85rem; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; transition: background .2s;
    }
    .btn-icon:hover { background: var(--border); }

    /* Assigned Activities List inside City Stop */
    .stop-activities-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .activities-box-title {
      font-size: 0.95rem; font-weight: 700; color: var(--muted);
      margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
    }

    .activity-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; gap: 14px; flex-wrap: wrap;
    }
    .activity-row:last-child { margin-bottom: 0; }

    .act-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 260px; }
    .act-name { font-size: 1.05rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .act-meta { font-size: 0.83rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
    .act-schedule-badge {
      background: rgba(56,189,248,.12); color: var(--primary);
      border: 1px solid rgba(56,189,248,.3); padding: 3px 8px; border-radius: 6px;
      font-weight: 600; font-size: 0.78rem; display: inline-flex; align-items: center; gap: 4px;
    }

    .act-actions { display: flex; align-items: center; gap: 8px; }

    .empty-stop-activities {
      text-align: center; padding: 24px; color: var(--muted); font-size: 0.88rem;
    }

    .empty-destinations {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px; text-align: center; color: var(--muted);
    }
    .empty-destinations .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Modal Form Overlay */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.68); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 500;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 32px; width: 100%; max-width: 480px;
      animation: slideUp .25s ease;
      box-shadow: 0 16px 48px rgba(0,0,0,.6);
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 14px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="logo">🌍 GlobeTrotter</a>
    <nav>
      <a href="/static/dashboard.html">Dashboard</a>
      <a href="/static/create-trip.html">Plan New Trip</a>
      <a href="/static/activities.html">Activities</a>
      <a href="/static/itinerary.html">Itinerary</a>
      <a href="/static/budget.html">Budget</a>
    </nav>
  </nav>

  <div class="details-wrapper">

    <div class="top-nav">
      <a href="/static/dashboard.html" class="back-link">← Back to Dashboard</a>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary btn-sm" onclick="shareCurrentTrip()">🔗 Share Trip</button>
        <a id="viewBudgetBtn" href="/static/budget.html" class="btn btn-outline btn-sm">💰 Budget Breakdown</a>
        <a id="viewItineraryBtn" href="/static/itinerary.html" class="btn btn-outline btn-sm">📅 View Itinerary</a>
        <button class="btn btn-outline btn-sm" onclick="deleteCurrentTrip()">🗑️ Delete</button>
      </div>
    </div>

    <div id="tripDetailsContainer">
      <div class="empty-destinations">
        <div class="icon">⏳</div>
        <p>Loading trip & itinerary stops...</p>
      </div>
    </div>

  </div>

  <!-- Modal 1: Add or Edit Destination Stop -->
  <div class="modal-overlay" id="stopModal" onclick="closeStopModalOutside(event)">
    <div class="modal">
      <h3 id="modalTitle">📍 Add Destination</h3>
      <input type="hidden" id="editStopId" value=""/>

      <div class="form-group">
        <label>City Name *</label>
        <input type="text" id="stopCity" placeholder="e.g. Paris, Rome, Tokyo"/>
      </div>
      <div class="form-group">
        <label>Country (Optional)</label>
        <input type="text" id="stopCountry" placeholder="e.g. France, Italy, Japan"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Arrive Date</label>
          <input type="date" id="stopStartDate"/>
        </div>
        <div class="form-group">
          <label>Depart Date</label>
          <input type="date" id="stopEndDate"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline btn-sm" onclick="closeStopModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="saveStop()">Save Destination →</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Edit Itinerary Activity (Date, Time, Notes) -->
  <div class="modal-overlay" id="scheduleModal" onclick="closeScheduleModalOutside(event)">
    <div class="modal">
      <h3 id="schedModalTitle">⏰ Edit Activity Schedule</h3>
      <input type="hidden" id="schedLinkId" value=""/>
      <p id="schedActName" style="color:var(--primary);font-weight:700;margin-bottom:16px"></p>

      <div class="form-row">
        <div class="form-group">
          <label>Assigned Date</label>
          <input type="date" id="schedDate"/>
        </div>
        <div class="form-group">
          <label>Assigned Time</label>
          <input type="text" id="schedTime" placeholder="e.g. 09:30 AM, 14:00"/>
        </div>
      </div>

      <div class="form-group">
        <label>Notes / Reminders (Optional)</label>
        <input type="text" id="schedNotes" placeholder="e.g. Bring tickets, wear comfortable shoes"/>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline btn-sm" onclick="closeScheduleModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="saveSchedule()">Save Schedule →</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  let currentTripId = null;
  let currentTripData = null;
  let currentBudget = null;

  async function loadTripDetails() {
    const params = new URLSearchParams(window.location.search);
    currentTripId = params.get('id');

    if (!currentTripId) {
      document.getElementById('tripDetailsContainer').innerHTML = `
        <div class="empty-destinations">
          <div class="icon">⚠️</div>
          <p>No trip ID specified in URL.</p>
          <a href="/static/dashboard.html" class="btn btn-primary" style="margin-top:16px">Go to Dashboard</a>
        </div>`;
      return;
    }
    const itinBtn   = document.getElementById('viewItineraryBtn');
    const budgetBtn = document.getElementById('viewBudgetBtn');
    if (itinBtn)   itinBtn.href   = `/static/itinerary.html?trip_id=${currentTripId}`;
    if (budgetBtn) budgetBtn.href = `/static/budget.html?trip_id=${currentTripId}`;

    try {
      const [tripRes, budgetRes] = await Promise.all([
        fetch(`/api/trips/${currentTripId}`),
        fetch(`/api/trips/${currentTripId}/budget`)
      ]);

      const json = await tripRes.json();
      if (budgetRes.ok) {
        const bJson = await budgetRes.json();
        if (bJson.success) currentBudget = bJson.data;
      }

      if (!json.success || !json.data) {
        document.getElementById('tripDetailsContainer').innerHTML = `
          <div class="empty-destinations">
            <div class="icon">❌</div>
            <p>Trip not found.</p>
            <a href="/static/dashboard.html" class="btn btn-primary" style="margin-top:16px">Go to Dashboard</a>
          </div>`;
        return;
      }

      currentTripData = json.data;
      renderTripPage(currentTripData, currentBudget);

    } catch(err) {
      document.getElementById('tripDetailsContainer').innerHTML = `
        <div class="empty-destinations">
          <div class="icon">⚠️</div>
          <p>Error loading trip details.</p>
        </div>`;
    }
  }

  function formatDateRange(startStr, endStr) {
    if (!startStr && !endStr) return 'Dates Flexible';
    
    function fmt(dStr) {
      if (!dStr) return '';
      const parts = dStr.split('-');
      if (parts.length === 3) {
        const dateObj = new Date(parts[0], parts[1]-1, parts[2]);
        return dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
      }
      return dStr;
    }

    const startFmt = fmt(startStr);
    const endFmt   = fmt(endStr);

    if (startFmt && endFmt) return `${startFmt} → ${endFmt}`;
    return startFmt || endFmt;
  }

  function renderTripPage(trip, budget) {
    const today = new Date().toISOString().split('T')[0];
    const isUpcoming = !trip.end_date || trip.end_date >= today;
    const statusTag  = isUpcoming ? '🟢 Upcoming' : '⚫ Past';
    const publicTag  = trip.is_public ? '🌐 Public' : '🔒 Private';

    let durationDays = 1;
    let durationText = 'Flexible Duration';
    if (trip.start_date && trip.end_date) {
      const start = new Date(trip.start_date);
      const end   = new Date(trip.end_date);
      const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays > 0) {
        durationDays = diffDays;
        durationText = `${diffDays} Days`;
      }
    }

    const stops = trip.stops || [];

    // Calculate total activities count across all stops
    let totalActsCount = 0;
    stops.forEach(s => { totalActsCount += (s.activities || []).length; });

    // Budget Engine figures
    const totalCost = budget ? budget.total_cost : 0;
    const avgDaily  = budget ? budget.avg_cost_per_day : (durationDays > 0 ? (totalCost / durationDays) : 0);

    document.getElementById('tripDetailsContainer').innerHTML = `
      <!-- Trip Banner -->
      <div class="trip-banner">
        <div class="banner-meta">
          <span class="badge badge-Sightseeing">${statusTag}</span>
          <span class="badge badge-Culture">${publicTag}</span>
          <span class="badge badge-Nature">${stops.length} Destination${stops.length !== 1 ? 's' : ''}</span>
        </div>

        <h1 class="trip-title">${escHtml(trip.title)}</h1>

        <div class="trip-info-pills">
          <div class="info-pill">
            📅 <span>${trip.start_date ? trip.start_date + (trip.end_date ? ' → ' + trip.end_date : '') : 'Dates flexible'}</span>
          </div>
          <div class="info-pill">
            ⏱ <span>${durationText}</span>
          </div>
          <div class="info-pill">
            👤 <span>Created by ${escHtml(trip.owner_name || 'Traveler')}</span>
          </div>
        </div>
      </div>

      <!-- ── Executive Trip Summary Experience (M3 Turn 5) ── -->
      <div class="summary-card">
        <div class="summary-card-header">
          <span>✨ Executive Trip Summary</span>
          <span style="font-size:0.82rem;color:var(--muted);font-weight:600">Quick Judge At-a-Glance Overview</span>
        </div>

        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-label">Trip Name</div>
            <div class="summary-value" style="font-size:1.1rem">${escHtml(trip.title)}</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Date Range</div>
            <div class="summary-value cyan" style="font-size:1rem">${formatDateRange(trip.start_date, trip.end_date)}</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Destinations</div>
            <div class="summary-value">${stops.length} Stop${stops.length !== 1 ? 's' : ''}</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Activities</div>
            <div class="summary-value">${totalActsCount} Scheduled</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Estimated Total Cost</div>
            <div class="summary-value green">₹${totalCost.toFixed(2)}</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Average Daily Cost</div>
            <div class="summary-value green">₹${avgDaily.toFixed(2)} / day</div>
          </div>
        </div>

        <!-- Destination Journey Flow Breadcrumb -->
        <div class="destination-journey-box">
          <div class="summary-label">🗺️ Destination Journey Flow</div>
          ${stops.length === 0 ? `
            <div style="font-size:0.88rem;color:var(--muted);margin-top:6px">No city stops added yet.</div>
          ` : `
            <div class="journey-flow">
              ${stops.map((s, idx) => `
                <div class="journey-stop-pill">
                  📍 <span>${escHtml(s.city)}</span>${s.country ? `, ${escHtml(s.country)}` : ''}
                </div>
                ${idx < stops.length - 1 ? `<span class="journey-arrow">➔</span>` : ''}
              `).join('')}
            </div>
          `}
        </div>
      </div>

      ${trip.description ? `
        <div class="description-card">
          <h3>📝 Trip Description</h3>
          <p>${escHtml(trip.description)}</p>
        </div>
      ` : ''}

      <!-- ── Multi-City Stops & Assigned Activities (Trip -> Stop -> Activities) ── -->
      <div class="dest-section">
        <div class="section-title">
          <span>🏙️ Multi-City Itinerary (${stops.length} City Stop${stops.length !== 1 ? 's' : ''})</span>
          <button class="btn btn-primary btn-sm" onclick="openAddStopModal()">＋ Add City Stop</button>
        </div>

        ${stops.length === 0 ? `
          <div class="empty-destinations">
            <div class="icon">✈️</div>
            <p>No city stops added to this trip yet.</p>
            <button class="btn btn-outline" onclick="openAddStopModal()" style="margin-top:12px">＋ Add First City Stop</button>
          </div>
        ` : `
          <div class="stops-container">
            ${stops.map((s, idx) => {
              const stopActs = s.activities || [];
              return `
                <div class="stop-block">
                  <div class="stop-header">
                    <div class="stop-header-info">
                      <div class="stop-badge">${s.stop_order || (idx + 1)}</div>
                      <div>
                        <div class="city-heading">📍 ${escHtml(s.city)}${s.country ? ', ' + escHtml(s.country) : ''}</div>
                        <div class="stop-dates-sub">📅 ${formatDateRange(s.start_date, s.end_date)}</div>
                      </div>
                    </div>

                    <div class="stop-header-actions">
                      <button class="btn-icon" title="Move Up" onclick="reorderStop(${s.id}, ${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.4"' : ''}>▲</button>
                      <button class="btn-icon" title="Move Down" onclick="reorderStop(${s.id}, ${idx}, 1)" ${idx === stops.length - 1 ? 'disabled style="opacity:0.4"' : ''}>▼</button>
                      <button class="btn btn-outline btn-sm" onclick="openEditStopModal(${s.id}, '${escJs(s.city)}', '${escJs(s.country || '')}', '${s.start_date || ''}', '${s.end_date || ''}')">✏️ Edit Stop</button>
                      <button class="btn btn-outline btn-sm" onclick="removeStop(${s.id}, '${escJs(s.city)}')">🗑️ Remove</button>
                    </div>
                  </div>

                  <!-- Activities for this City Stop -->
                  <div class="stop-activities-box">
                    <div class="activities-box-title">
                      <span>📌 Activities in ${escHtml(s.city)} (${stopActs.length})</span>
                      <a href="/static/activities.html?trip_id=${trip.id}" class="btn btn-outline btn-sm">＋ Discover Activities</a>
                    </div>

                    ${stopActs.length === 0 ? `
                      <div class="empty-stop-activities">
                        No activities assigned to ${escHtml(s.city)} yet.
                        <a href="/static/activities.html?trip_id=${trip.id}" style="color:var(--primary);margin-left:6px">Browse & Add →</a>
                      </div>
                    ` : `
                      <div>
                        ${stopActs.map(a => {
                          const linkId   = a.trip_activity_id || a.id;
                          const actDate  = a.activity_date || a.date || '';
                          const actTime  = a.activity_time || a.time || '';
                          const actNotes = a.notes || '';

                          return `
                            <div class="activity-row">
                              <div class="act-info">
                                <div>
                                  <div class="act-name">🎟️ ${escHtml(a.name)}</div>
                                  <div class="act-meta">
                                    <span>⏱ ${escHtml(a.duration)}</span>
                                    <span>💰 ${a.cost > 0 ? '₹' + a.cost.toFixed(2) : 'Free'}</span>
                                    
                                    ${actDate ? `<span class="act-schedule-badge">📅 ${escHtml(actDate)}</span>` : '<span style="color:var(--warning);font-size:0.78rem">📅 Date Pending</span>'}
                                    ${actTime ? `<span class="act-schedule-badge">🕒 ${escHtml(actTime)}</span>` : '<span style="color:var(--warning);font-size:0.78rem">🕒 Time Pending</span>'}
                                    ${actNotes ? `<span>📝 ${escHtml(actNotes)}</span>` : ''}
                                  </div>
                                </div>
                              </div>

                              <div class="act-actions">
                                <span class="badge ${badgeClass(a.category)}">${escHtml(a.category)}</span>
                                <button class="btn btn-outline btn-sm" onclick="openScheduleModal(${linkId}, '${escJs(a.name)}', '${actDate}', '${actTime}', '${escJs(actNotes)}')">⏰ Schedule / Edit</button>
                                <button class="btn btn-outline btn-sm" onclick="removeActivityFromStop(${s.id}, ${a.id || a.activity_id}, '${escJs(a.name)}', ${linkId})">🗑️</button>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>
    `;
  }

  /* ── Itinerary Activity Schedule Modal Handlers (M2 Turn 4) ── */
  function openScheduleModal(linkId, actName, actDate, actTime, notes) {
    document.getElementById('schedLinkId').value = linkId;
    document.getElementById('schedActName').textContent = '🎟️ ' + actName;
    document.getElementById('schedDate').value = actDate || '';
    document.getElementById('schedTime').value = actTime || '';
    document.getElementById('schedNotes').value = notes || '';
    document.getElementById('scheduleModal').classList.add('open');
  }

  function closeScheduleModal() { document.getElementById('scheduleModal').classList.remove('open'); }
  function closeScheduleModalOutside(e) {
    if (e.target === document.getElementById('scheduleModal')) closeScheduleModal();
  }

  async function saveSchedule() {
    const linkId = document.getElementById('schedLinkId').value;
    const date   = document.getElementById('schedDate').value;
    const time   = document.getElementById('schedTime').value.trim();
    const notes  = document.getElementById('schedNotes').value.trim();

    if (!linkId) return;

    try {
      const res = await fetch(`/api/trip-activities/${linkId}/schedule`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activity_date: date, activity_time: time, notes: notes })
      });
      const json = await res.json();

      if (json.success) {
        closeScheduleModal();
        showToast('✅ Activity schedule updated!', 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + (json.message || 'Failed to update schedule.'), 'red');
      }
    } catch(e) {
      showToast('❌ Server error updating schedule.', 'red');
    }
  }

  /* ── Destination Stop Modal Handlers ── */
  function openAddStopModal() {
    document.getElementById('modalTitle').textContent = '📍 Add Destination Stop';
    document.getElementById('editStopId').value = '';
    document.getElementById('stopCity').value = '';
    document.getElementById('stopCountry').value = '';
    document.getElementById('stopStartDate').value = '';
    document.getElementById('stopEndDate').value = '';
    document.getElementById('stopModal').classList.add('open');
  }

  function openEditStopModal(id, city, country, startDate, endDate) {
    document.getElementById('modalTitle').textContent = '✏️ Edit Destination Stop';
    document.getElementById('editStopId').value = id;
    document.getElementById('stopCity').value = city;
    document.getElementById('stopCountry').value = country;
    document.getElementById('stopStartDate').value = startDate;
    document.getElementById('stopEndDate').value = endDate;
    document.getElementById('stopModal').classList.add('open');
  }

  function closeStopModal() { document.getElementById('stopModal').classList.remove('open'); }
  function closeStopModalOutside(e) {
    if (e.target === document.getElementById('stopModal')) closeStopModal();
  }

  async function saveStop() {
    const editId = document.getElementById('editStopId').value;
    const city   = document.getElementById('stopCity').value.trim();
    if (!city) { showToast('❌ City name is required', 'red'); return; }

    const country   = document.getElementById('stopCountry').value.trim();
    const startDate = document.getElementById('stopStartDate').value;
    const endDate   = document.getElementById('stopEndDate').value;

    try {
      let res;
      if (editId) {
        res = await fetch(`/api/trips/stops/${editId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city, country, start_date: startDate, end_date: endDate })
        });
      } else {
        res = await fetch(`/api/trips/${currentTripId}/stops`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city, country, start_date: startDate, end_date: endDate })
        });
      }

      const json = await res.json();
      if (json.success) {
        closeStopModal();
        showToast(editId ? `✅ Updated stop: ${city}` : `✅ Added stop: ${city}`, 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Server error saving stop.', 'red');
    }
  }

  async function removeStop(stopId, cityName) {
    if (!confirm(`Remove ${cityName} stop and its assigned activities?`)) return;

    try {
      const res = await fetch(`/api/trips/stops/${stopId}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) {
        showToast(`✅ Removed stop: ${cityName}`, 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Server error removing stop.', 'red');
    }
  }

  async function removeActivityFromStop(stopId, activityId, activityName, linkId) {
    if (!confirm(`Remove "${activityName}" from this city stop?`)) return;

    try {
      let res;
      if (linkId) {
        res = await fetch(`/api/trip-activities/${linkId}`, { method: 'DELETE' });
      } else {
        res = await fetch(`/api/trips/stops/${stopId}/activities/${activityId}`, { method: 'DELETE' });
      }
      let json = await res.json();
      
      if (!json.success) {
        res = await fetch(`/api/trips/${currentTripId}/activities/${activityId}`, { method: 'DELETE' });
        json = await res.json();
      }

      if (json.success) {
        showToast(`✅ Removed "${activityName}"`, 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Error removing activity.', 'red');
    }
  }

  async function reorderStop(stopId, currentIndex, direction) {
    if (!currentTripData || !currentTripData.stops) return;
    const stops = currentTripData.stops;
    const targetIndex = currentIndex + direction;
    if (targetIndex < 0 || targetIndex >= stops.length) return;

    const currentStop = stops[currentIndex];
    const targetStop  = stops[targetIndex];

    try {
      await fetch(`/api/trips/stops/${currentStop.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stop_order: targetStop.stop_order || (targetIndex + 1) })
      });

      await fetch(`/api/trips/stops/${targetStop.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stop_order: currentStop.stop_order || (currentIndex + 1) })
      });

      showToast('✅ Reordered city stops!', 'green');
      loadTripDetails();
    } catch(e) {
      showToast('❌ Reordering failed.', 'red');
    }
  }

  function badgeClass(cat) {
    const map = { Sightseeing: 'badge-Sightseeing', Culture: 'badge-Culture', Nature: 'badge-Nature', Adventure: 'badge-Adventure', Experience: 'badge-Experience' };
    return map[cat] || 'badge-Sightseeing';
  }

  async function shareCurrentTrip() {
    if (!currentTripId) return;

    try {
      const res = await fetch(`/api/trips/${currentTripId}/share`, { method: 'POST' });
      const json = await res.json();

      if (json.success) {
        const fullUrl = window.location.origin + json.data.public_url;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(fullUrl);
          showToast('🔗 Public itinerary link copied to clipboard!', 'green');
        } else {
          showToast(`Public Link: ${fullUrl}`, 'green');
        }
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Error sharing trip.', 'red');
    }
  }

  async function deleteCurrentTrip() {
    if (!currentTripId || !confirm('Are you sure you want to delete this trip?')) return;

    try {
      const res = await fetch(`/api/trips/${currentTripId}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) {
        showToast('✅ Trip deleted. Redirecting to Dashboard...', 'green');
        setTimeout(() => window.location.href = '/static/dashboard.html', 1000);
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Failed to delete trip.', 'red');
    }
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escJs(s) {
    return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  let toastTimer;
  function showToast(msg, type = 'green') {
    const t = document.getElementById('toast');
    clearTimeout(toastTimer);
    t.textContent = msg;
    t.className   = `show ${type}`;
    toastTimer = setTimeout(() => { t.className = ''; }, 3000);
  }

  loadTripDetails();
</script>

</body>
</html>
