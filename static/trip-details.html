<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GlobeTrotter Trip Details — Multi-city destination itinerary, dates, and activities."/>
  <title>Trip Destinations & Details — GlobeTrotter</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .details-wrapper {
      max-width: 1000px;
      margin: 36px auto 80px;
      padding: 0 24px;
    }

    .top-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--primary); }

    /* Trip Header Banner */
    .trip-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      position: relative;
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
    }
    .trip-banner::after {
      content: '✈️';
      position: absolute; right: 24px; bottom: 10px;
      font-size: 7rem; opacity: 0.12; pointer-events: none;
    }

    .banner-meta {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap;
    }

    .trip-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; }

    .trip-info-pills {
      display: flex; gap: 20px; flex-wrap: wrap;
      color: var(--muted); font-size: 0.9rem; margin-top: 16px;
    }
    .info-pill { display: flex; align-items: center; gap: 6px; }

    .description-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
    }
    .description-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
    .description-card p  { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }

    /* ── Destination Section ──────────────────────────── */
    .dest-section { margin-bottom: 40px; }
    .section-title {
      font-size: 1.3rem; font-weight: 700; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .dest-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .dest-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .dest-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .dest-card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 12px;
    }
    .dest-card .city-title {
      font-size: 1.35rem; font-weight: 800; color: #f8fafc;
      display: flex; align-items: center; gap: 8px;
    }
    .dest-card .country-subtitle {
      font-size: 0.85rem; color: var(--muted); margin-top: 2px;
    }
    .stop-badge {
      background: rgba(56,189,248,.12); color: var(--primary);
      font-weight: 700; font-size: 0.78rem; padding: 4px 10px;
      border-radius: 999px; border: 1px solid rgba(56,189,248,.3);
    }

    .dest-dates-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin: 14px 0 18px;
      font-weight: 600; font-size: 0.95rem; color: var(--accent);
      display: flex; align-items: center; gap: 8px;
    }

    .dest-card-actions {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 14px; border-top: 1px solid var(--border);
    }

    .reorder-btns { display: flex; gap: 4px; }
    .btn-icon {
      padding: 4px 8px; font-size: 0.8rem; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; transition: background .2s;
    }
    .btn-icon:hover { background: var(--border); }

    .action-group { display: flex; gap: 8px; }

    .empty-destinations {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px; text-align: center; color: var(--muted);
      grid-column: 1 / -1;
    }
    .empty-destinations .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Activities Section */
    .activities-section { margin-bottom: 40px; }
    .activities-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .activity-mini-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .activity-mini-card h4 { font-size: 0.98rem; font-weight: 700; }
    .activity-mini-card .meta { font-size: 0.8rem; color: var(--muted); }

    .empty-activities {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px; text-align: center; color: var(--muted);
    }

    /* Modal Form */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 500;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; width: 100%; max-width: 480px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 14px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="logo">🌍 GlobeTrotter</a>
    <nav>
      <a href="/static/dashboard.html">Dashboard</a>
      <a href="/static/create-trip.html">Plan New Trip</a>
      <a href="/static/activities.html">Activities</a>
    </nav>
  </nav>

  <div class="details-wrapper">

    <div class="top-nav">
      <a href="/static/dashboard.html" class="back-link">← Back to Dashboard</a>
      <button class="btn btn-outline btn-sm" onclick="deleteCurrentTrip()">🗑️ Delete Trip</button>
    </div>

    <div id="tripDetailsContainer">
      <div class="empty-destinations">
        <div class="icon">⏳</div>
        <p>Loading trip details & destinations...</p>
      </div>
    </div>

  </div>

  <!-- Modal: Add or Edit Destination Stop -->
  <div class="modal-overlay" id="stopModal" onclick="closeStopModalOutside(event)">
    <div class="modal">
      <h3 id="modalTitle">📍 Add Destination</h3>
      <input type="hidden" id="editStopId" value=""/>

      <div class="form-group">
        <label>City Name *</label>
        <input type="text" id="stopCity" placeholder="e.g. Paris, Rome, Tokyo"/>
      </div>
      <div class="form-group">
        <label>Country (Optional)</label>
        <input type="text" id="stopCountry" placeholder="e.g. France, Italy, Japan"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Arrive Date</label>
          <input type="date" id="stopStartDate"/>
        </div>
        <div class="form-group">
          <label>Depart Date</label>
          <input type="date" id="stopEndDate"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline btn-sm" onclick="closeStopModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="saveStop()">Save Destination →</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  let currentTripId = null;
  let currentTripData = null;

  async function loadTripDetails() {
    const params = new URLSearchParams(window.location.search);
    currentTripId = params.get('id');

    if (!currentTripId) {
      document.getElementById('tripDetailsContainer').innerHTML = `
        <div class="empty-destinations">
          <div class="icon">⚠️</div>
          <p>No trip ID specified in URL.</p>
          <a href="/static/dashboard.html" class="btn btn-primary" style="margin-top:16px">Go to Dashboard</a>
        </div>`;
      return;
    }

    try {
      const res = await fetch(`/api/trips/${currentTripId}`);
      const json = await res.json();

      if (!json.success || !json.data) {
        document.getElementById('tripDetailsContainer').innerHTML = `
          <div class="empty-destinations">
            <div class="icon">❌</div>
            <p>Trip not found.</p>
            <a href="/static/dashboard.html" class="btn btn-primary" style="margin-top:16px">Go to Dashboard</a>
          </div>`;
        return;
      }

      currentTripData = json.data;
      renderTripPage(currentTripData);

    } catch(err) {
      document.getElementById('tripDetailsContainer').innerHTML = `
        <div class="empty-destinations">
          <div class="icon">⚠️</div>
          <p>Error loading trip details.</p>
        </div>`;
    }
  }

  function formatDateRange(startStr, endStr) {
    if (!startStr && !endStr) return 'Dates Flexible';
    
    function fmt(dStr) {
      if (!dStr) return '';
      const parts = dStr.split('-');
      if (parts.length === 3) {
        const dateObj = new Date(parts[0], parts[1]-1, parts[2]);
        return dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
      }
      return dStr;
    }

    const startFmt = fmt(startStr);
    const endFmt   = fmt(endStr);

    if (startFmt && endFmt) return `${startFmt} → ${endFmt}`;
    return startFmt || endFmt;
  }

  function renderTripPage(trip) {
    const today = new Date().toISOString().split('T')[0];
    const isUpcoming = !trip.end_date || trip.end_date >= today;
    const statusTag  = isUpcoming ? '🟢 Upcoming' : '⚫ Past';
    const publicTag  = trip.is_public ? '🌐 Public' : '🔒 Private';

    let durationText = 'Flexible Duration';
    if (trip.start_date && trip.end_date) {
      const start = new Date(trip.start_date);
      const end   = new Date(trip.end_date);
      const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays > 0) durationText = `${diffDays} Days`;
    }

    const stops = trip.stops || [];
    const activities = trip.activities || [];

    document.getElementById('tripDetailsContainer').innerHTML = `
      <div class="trip-banner">
        <div class="banner-meta">
          <span class="badge badge-Sightseeing">${statusTag}</span>
          <span class="badge badge-Culture">${publicTag}</span>
          <span class="badge badge-Nature">${stops.length} Destination${stops.length !== 1 ? 's' : ''}</span>
        </div>

        <h1 class="trip-title">${escHtml(trip.title)}</h1>

        <div class="trip-info-pills">
          <div class="info-pill">
            📅 <span>${trip.start_date ? trip.start_date + (trip.end_date ? ' → ' + trip.end_date : '') : 'Dates flexible'}</span>
          </div>
          <div class="info-pill">
            ⏱ <span>${durationText}</span>
          </div>
          <div class="info-pill">
            👤 <span>Created by ${escHtml(trip.owner_name || 'Traveler')}</span>
          </div>
        </div>
      </div>

      ${trip.description ? `
        <div class="description-card">
          <h3>📝 Trip Description</h3>
          <p>${escHtml(trip.description)}</p>
        </div>
      ` : ''}

      <!-- ── Multi-City Destinations Section ── -->
      <div class="dest-section">
        <div class="section-title">
          <span>📍 Trip Destinations (${stops.length})</span>
          <button class="btn btn-primary btn-sm" onclick="openAddStopModal()">＋ Add Destination</button>
        </div>

        ${stops.length === 0 ? `
          <div class="empty-destinations">
            <div class="icon">✈️</div>
            <p>No destinations added to this trip yet.</p>
            <button class="btn btn-outline" onclick="openAddStopModal()" style="margin-top:12px">＋ Add First Destination</button>
          </div>
        ` : `
          <div class="dest-grid">
            ${stops.map((s, idx) => `
              <div class="dest-card">
                <div>
                  <div class="dest-card-header">
                    <div>
                      <div class="city-title">${escHtml(s.city)}</div>
                      ${s.country ? `<div class="country-subtitle">${escHtml(s.country)}</div>` : ''}
                    </div>
                    <span class="stop-badge">Stop ${s.stop_order || (idx + 1)}</span>
                  </div>

                  <div class="dest-dates-box">
                    📅 <span>${formatDateRange(s.start_date, s.end_date)}</span>
                  </div>
                </div>

                <div class="dest-card-actions">
                  <div class="reorder-btns">
                    <button class="btn-icon" title="Move Up" onclick="reorderStop(${s.id}, ${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.4"' : ''}>▲</button>
                    <button class="btn-icon" title="Move Down" onclick="reorderStop(${s.id}, ${idx}, 1)" ${idx === stops.length - 1 ? 'disabled style="opacity:0.4"' : ''}>▼</button>
                  </div>
                  <div class="action-group">
                    <button class="btn btn-outline btn-sm" onclick="openEditStopModal(${s.id}, '${escJs(s.city)}', '${escJs(s.country || '')}', '${s.start_date || ''}', '${s.end_date || ''}')">✏️ Edit</button>
                    <button class="btn btn-outline btn-sm" onclick="removeStop(${s.id}, '${escJs(s.city)}')">🗑️ Remove</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>

      <!-- Saved Activities Section -->
      <div class="activities-section">
        <div class="section-title">
          <span>📌 Saved Activities (${activities.length})</span>
          <a href="/static/activities.html" class="btn btn-primary btn-sm">＋ Add Activities</a>
        </div>

        ${activities.length === 0 ? `
          <div class="empty-activities">
            <div class="icon">🎟️</div>
            <p>No activities saved for this trip yet.</p>
            <a href="/static/activities.html" class="btn btn-outline" style="margin-top:12px">Explore Activities →</a>
          </div>
        ` : `
          <div class="activities-list">
            ${activities.map(a => `
              <div class="activity-mini-card">
                <h4>${escHtml(a.name)}</h4>
                <div class="meta">📍 ${escHtml(a.city)} · ⏱ ${escHtml(a.duration)}</div>
                <span class="badge ${badgeClass(a.category)}" style="align-self:flex-start">${a.category}</span>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
  }

  /* ── Add / Edit Stop Modal ── */
  function openAddStopModal() {
    document.getElementById('modalTitle').textContent = '📍 Add Destination';
    document.getElementById('editStopId').value = '';
    document.getElementById('stopCity').value = '';
    document.getElementById('stopCountry').value = '';
    document.getElementById('stopStartDate').value = '';
    document.getElementById('stopEndDate').value = '';
    document.getElementById('stopModal').classList.add('open');
  }

  function openEditStopModal(id, city, country, startDate, endDate) {
    document.getElementById('modalTitle').textContent = '✏️ Edit Destination';
    document.getElementById('editStopId').value = id;
    document.getElementById('stopCity').value = city;
    document.getElementById('stopCountry').value = country;
    document.getElementById('stopStartDate').value = startDate;
    document.getElementById('stopEndDate').value = endDate;
    document.getElementById('stopModal').classList.add('open');
  }

  function closeStopModal() {
    document.getElementById('stopModal').classList.remove('open');
  }
  function closeStopModalOutside(e) {
    if (e.target === document.getElementById('stopModal')) closeStopModal();
  }

  async function saveStop() {
    const editId = document.getElementById('editStopId').value;
    const city   = document.getElementById('stopCity').value.trim();
    if (!city) { showToast('❌ City name is required', 'red'); return; }

    const country   = document.getElementById('stopCountry').value.trim();
    const startDate = document.getElementById('stopStartDate').value;
    const endDate   = document.getElementById('stopEndDate').value;

    try {
      let res, json;
      if (editId) {
        // Edit existing stop
        res = await fetch(`/api/trips/stops/${editId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city, country, start_date: startDate, end_date: endDate })
        });
      } else {
        // Create new stop
        res = await fetch(`/api/trips/${currentTripId}/stops`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city, country, start_date: startDate, end_date: endDate })
        });
      }

      json = await res.json();
      if (json.success) {
        closeStopModal();
        showToast(editId ? `✅ Updated destination: ${city}` : `✅ Added destination: ${city}`, 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Server error saving destination.', 'red');
    }
  }

  async function removeStop(stopId, cityName) {
    if (!confirm(`Remove ${cityName} from destinations?`)) return;

    try {
      const res = await fetch(`/api/trips/stops/${stopId}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) {
        showToast(`✅ Removed destination: ${cityName}`, 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Server error removing destination.', 'red');
    }
  }

  async function reorderStop(stopId, currentIndex, direction) {
    if (!currentTripData || !currentTripData.stops) return;
    const stops = currentTripData.stops;
    const targetIndex = currentIndex + direction;
    if (targetIndex < 0 || targetIndex >= stops.length) return;

    const currentStop = stops[currentIndex];
    const targetStop  = stops[targetIndex];

    try {
      // Swap stop_orders
      await fetch(`/api/trips/stops/${currentStop.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stop_order: targetStop.stop_order || (targetIndex + 1) })
      });

      await fetch(`/api/trips/stops/${targetStop.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stop_order: currentStop.stop_order || (currentIndex + 1) })
      });

      showToast('✅ Reordered destinations!', 'green');
      loadTripDetails();
    } catch(e) {
      showToast('❌ Reordering failed.', 'red');
    }
  }

  function badgeClass(cat) {
    const map = { Sightseeing: 'badge-Sightseeing', Culture: 'badge-Culture', Nature: 'badge-Nature', Adventure: 'badge-Adventure', Experience: 'badge-Experience' };
    return map[cat] || 'badge-Sightseeing';
  }

  async function deleteCurrentTrip() {
    if (!currentTripId || !confirm('Are you sure you want to delete this trip?')) return;

    try {
      const res = await fetch(`/api/trips/${currentTripId}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) {
        showToast('✅ Trip deleted. Redirecting to Dashboard...', 'green');
        setTimeout(() => window.location.href = '/static/dashboard.html', 1000);
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Failed to delete trip.', 'red');
    }
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escJs(s) {
    return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  let toastTimer;
  function showToast(msg, type = 'green') {
    const t = document.getElementById('toast');
    clearTimeout(toastTimer);
    t.textContent = msg;
    t.className   = `show ${type}`;
    toastTimer = setTimeout(() => { t.className = ''; }, 3000);
  }

  loadTripDetails();
</script>

</body>
</html>
