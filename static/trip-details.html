<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GlobeTrotter Trip Details — Overview, multi-city stops, itinerary, and activities for your travel plan."/>
  <title>Trip Details — GlobeTrotter</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .details-wrapper {
      max-width: 1000px;
      margin: 36px auto 80px;
      padding: 0 24px;
    }

    .top-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--primary); }

    /* Trip Header Banner */
    .trip-banner {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      position: relative;
      overflow: hidden;
      margin-bottom: 32px;
    }
    .trip-banner::after {
      content: '✈️';
      position: absolute; right: 24px; bottom: 10px;
      font-size: 7rem; opacity: 0.12; pointer-events: none;
    }

    .banner-meta {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap;
    }

    .trip-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; }

    .trip-info-pills {
      display: flex; gap: 20px; flex-wrap: wrap;
      color: var(--muted); font-size: 0.9rem; margin-top: 16px;
    }
    .info-pill { display: flex; align-items: center; gap: 6px; }

    .description-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
    }
    .description-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
    .description-card p  { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }

    /* Multi-City Stops Timeline */
    .stops-section { margin-bottom: 36px; }
    .section-title {
      font-size: 1.25rem; font-weight: 700; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .stops-timeline {
      display: flex; flex-direction: column; gap: 14px; position: relative;
    }
    
    .stop-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between;
      transition: border-color var(--transition), transform var(--transition);
    }
    .stop-card:hover { border-color: var(--primary); transform: translateX(4px); }

    .stop-main { display: flex; align-items: center; gap: 16px; }
    .stop-number {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(56,189,248,.12); color: var(--primary);
      font-weight: 800; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; border: 1px solid rgba(56,189,248,.3);
    }
    .stop-details .city-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
    .stop-details .stop-dates { font-size: 0.82rem; color: var(--muted); }

    .stop-actions { display: flex; align-items: center; gap: 10px; }

    .empty-stops {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px; text-align: center; color: var(--muted);
    }

    /* Activities in this trip */
    .activities-section { margin-bottom: 40px; }
    .activities-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .activity-mini-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .activity-mini-card h4 { font-size: 0.98rem; font-weight: 700; }
    .activity-mini-card .meta { font-size: 0.8rem; color: var(--muted); }

    .empty-activities {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px; text-align: center; color: var(--muted);
    }

    /* Modal for Add Stop */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 500;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; width: 100%; max-width: 480px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 14px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="logo">🌍 GlobeTrotter</a>
    <nav>
      <a href="/static/dashboard.html">Dashboard</a>
      <a href="/static/create-trip.html">Plan New Trip</a>
      <a href="/static/activities.html">Activities</a>
    </nav>
  </nav>

  <div class="details-wrapper">

    <div class="top-nav">
      <a href="/static/dashboard.html" class="back-link">← Back to Dashboard</a>
      <button class="btn btn-outline btn-sm" onclick="deleteCurrentTrip()">🗑️ Delete Trip</button>
    </div>

    <div id="tripDetailsContainer">
      <div class="empty-stops">
        <div class="icon">⏳</div>
        <p>Loading trip details...</p>
      </div>
    </div>

  </div>

  <!-- Modal: Add Stop -->
  <div class="modal-overlay" id="addStopModal" onclick="closeStopModalOutside(event)">
    <div class="modal">
      <h3>🏙️ Add City Stop</h3>
      <div class="form-group">
        <label>City Name *</label>
        <input type="text" id="stopCity" placeholder="e.g. Paris, Rome, Tokyo"/>
      </div>
      <div class="form-group">
        <label>Country (Optional)</label>
        <input type="text" id="stopCountry" placeholder="e.g. France, Italy, Japan"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Arrive Date</label>
          <input type="date" id="stopStartDate"/>
        </div>
        <div class="form-group">
          <label>Depart Date</label>
          <input type="date" id="stopEndDate"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline btn-sm" onclick="closeStopModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="submitAddStop()">＋ Add Stop</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  let currentTripId = null;
  let currentTripData = null;

  async function loadTripDetails() {
    const params = new URLSearchParams(window.location.search);
    currentTripId = params.get('id');

    if (!currentTripId) {
      document.getElementById('tripDetailsContainer').innerHTML = `
        <div class="empty-stops">
          <div class="icon">⚠️</div>
          <p>No trip ID specified in URL.</p>
          <a href="/static/dashboard.html" class="btn btn-primary" style="margin-top:16px">Go to Dashboard</a>
        </div>`;
      return;
    }

    try {
      const res = await fetch(`/api/trips/${currentTripId}`);
      const json = await res.json();

      if (!json.success || !json.data) {
        document.getElementById('tripDetailsContainer').innerHTML = `
          <div class="empty-stops">
            <div class="icon">❌</div>
            <p>Trip not found.</p>
            <a href="/static/dashboard.html" class="btn btn-primary" style="margin-top:16px">Go to Dashboard</a>
          </div>`;
        return;
      }

      currentTripData = json.data;
      renderTripPage(currentTripData);

    } catch(err) {
      document.getElementById('tripDetailsContainer').innerHTML = `
        <div class="empty-stops">
          <div class="icon">⚠️</div>
          <p>Error loading trip details.</p>
        </div>`;
    }
  }

  function renderTripPage(trip) {
    const today = new Date().toISOString().split('T')[0];
    const isUpcoming = !trip.end_date || trip.end_date >= today;
    const statusTag  = isUpcoming ? '🟢 Upcoming' : '⚫ Past';
    const publicTag  = trip.is_public ? '🌐 Public' : '🔒 Private';

    let durationText = 'Flexible Duration';
    if (trip.start_date && trip.end_date) {
      const start = new Date(trip.start_date);
      const end   = new Date(trip.end_date);
      const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays > 0) durationText = `${diffDays} Days`;
    }

    const stops = trip.stops || [];
    const activities = trip.activities || [];

    document.getElementById('tripDetailsContainer').innerHTML = `
      <div class="trip-banner">
        <div class="banner-meta">
          <span class="badge badge-Sightseeing">${statusTag}</span>
          <span class="badge badge-Culture">${publicTag}</span>
          <span class="badge badge-Nature">${stops.length} City Stop${stops.length !== 1 ? 's' : ''}</span>
        </div>

        <h1 class="trip-title">${escHtml(trip.title)}</h1>

        <div class="trip-info-pills">
          <div class="info-pill">
            📅 <span>${trip.start_date ? trip.start_date + (trip.end_date ? ' → ' + trip.end_date : '') : 'Dates not set'}</span>
          </div>
          <div class="info-pill">
            ⏱ <span>${durationText}</span>
          </div>
          <div class="info-pill">
            👤 <span>Created by ${escHtml(trip.owner_name || 'Traveler')}</span>
          </div>
        </div>
      </div>

      ${trip.description ? `
        <div class="description-card">
          <h3>📝 Trip Description</h3>
          <p>${escHtml(trip.description)}</p>
        </div>
      ` : ''}

      <!-- Multi-City Stops Section -->
      <div class="stops-section">
        <div class="section-title">
          <span>🏙️ Multi-City Route (${stops.length} Stops)</span>
          <button class="btn btn-primary btn-sm" onclick="openStopModal()">＋ Add City Stop</button>
        </div>

        ${stops.length === 0 ? `
          <div class="empty-stops">
            <div class="icon">🧭</div>
            <p>No city stops added to this trip route yet.</p>
            <button class="btn btn-outline" onclick="openStopModal()" style="margin-top:12px">＋ Add First Stop</button>
          </div>
        ` : `
          <div class="stops-timeline">
            ${stops.map((s, idx) => `
              <div class="stop-card">
                <div class="stop-main">
                  <div class="stop-number">${s.stop_order || (idx + 1)}</div>
                  <div class="stop-details">
                    <div class="city-name">📍 ${escHtml(s.city)}${s.country ? ', ' + escHtml(s.country) : ''}</div>
                    <div class="stop-dates">
                      ${s.start_date ? '📅 ' + s.start_date + (s.end_date ? ' → ' + s.end_date : '') : 'Dates flexible'}
                    </div>
                  </div>
                </div>
                <div class="stop-actions">
                  <button class="btn btn-outline btn-sm" onclick="removeStop(${s.id}, '${escJs(s.city)}')">🗑️ Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>

      <!-- Saved Activities Section -->
      <div class="activities-section">
        <div class="section-title">
          <span>📌 Saved Activities (${activities.length})</span>
          <a href="/static/activities.html" class="btn btn-primary btn-sm">＋ Add Activities</a>
        </div>

        ${activities.length === 0 ? `
          <div class="empty-activities">
            <div class="icon">🎟️</div>
            <p>No activities saved for this trip yet.</p>
            <a href="/static/activities.html" class="btn btn-outline" style="margin-top:12px">Explore Activities →</a>
          </div>
        ` : `
          <div class="activities-list">
            ${activities.map(a => `
              <div class="activity-mini-card">
                <h4>${escHtml(a.name)}</h4>
                <div class="meta">📍 ${escHtml(a.city)} · ⏱ ${escHtml(a.duration)}</div>
                <span class="badge ${badgeClass(a.category)}" style="align-self:flex-start">${a.category}</span>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
  }

  /* ── Add Stop Logic ── */
  function openStopModal() { document.getElementById('addStopModal').classList.add('open'); }
  function closeStopModal() { document.getElementById('addStopModal').classList.remove('open'); }
  function closeStopModalOutside(e) {
    if (e.target === document.getElementById('addStopModal')) closeStopModal();
  }

  async function submitAddStop() {
    const city = document.getElementById('stopCity').value.trim();
    if (!city) { showToast('❌ City name is required', 'red'); return; }

    const country   = document.getElementById('stopCountry').value.trim();
    const startDate = document.getElementById('stopStartDate').value;
    const endDate   = document.getElementById('stopEndDate').value;

    try {
      const res = await fetch(`/api/trips/${currentTripId}/stops`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city, country, start_date: startDate, end_date: endDate })
      });
      const json = await res.json();

      if (json.success) {
        closeStopModal();
        document.getElementById('stopCity').value = '';
        document.getElementById('stopCountry').value = '';
        document.getElementById('stopStartDate').value = '';
        document.getElementById('stopEndDate').value = '';
        showToast(`✅ Added stop: ${city}`, 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Server error adding stop.', 'red');
    }
  }

  async function removeStop(stopId, cityName) {
    if (!confirm(`Remove ${cityName} from this trip?`)) return;

    try {
      const res = await fetch(`/api/trips/stops/${stopId}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) {
        showToast(`✅ Removed stop: ${cityName}`, 'green');
        loadTripDetails();
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Server error removing stop.', 'red');
    }
  }

  function badgeClass(cat) {
    const map = { Sightseeing: 'badge-Sightseeing', Culture: 'badge-Culture', Nature: 'badge-Nature', Adventure: 'badge-Adventure', Experience: 'badge-Experience' };
    return map[cat] || 'badge-Sightseeing';
  }

  async function deleteCurrentTrip() {
    if (!currentTripId || !confirm('Are you sure you want to delete this trip?')) return;

    try {
      const res = await fetch(`/api/trips/${currentTripId}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) {
        showToast('✅ Trip deleted. Redirecting to Dashboard...', 'green');
        setTimeout(() => window.location.href = '/static/dashboard.html', 1000);
      } else {
        showToast('❌ ' + json.message, 'red');
      }
    } catch(e) {
      showToast('❌ Failed to delete trip.', 'red');
    }
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escJs(s) {
    return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  let toastTimer;
  function showToast(msg, type = 'green') {
    const t = document.getElementById('toast');
    clearTimeout(toastTimer);
    t.textContent = msg;
    t.className   = `show ${type}`;
    toastTimer = setTimeout(() => { t.className = ''; }, 3000);
  }

  loadTripDetails();
</script>

</body>
</html>
