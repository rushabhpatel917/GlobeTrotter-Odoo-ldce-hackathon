<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GlobeTrotter — Discover and select amazing activities for your trip with real-time selection state."/>
  <title>Discover & Select Activities — GlobeTrotter</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    /* ── Activity Discovery & Selection Polish ── */
    .controls-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .controls-bar {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .controls-bar input  { flex: 1; min-width: 220px; font-size: 0.95rem; }
    .controls-bar select { width: 190px; flex-shrink: 0; font-size: 0.9rem; }

    .city-tabs {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding-top: 6px;
    }
    .city-tab {
      padding: 7px 16px; border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg); color: var(--muted);
      cursor: pointer; font-size: 0.84rem; font-weight: 600;
      transition: all var(--transition);
      display: flex; align-items: center; gap: 4px;
    }
    .city-tab:hover { border-color: var(--primary); color: var(--primary); }
    .city-tab.active {
      border-color: var(--primary); color: var(--primary);
      background: rgba(56,189,248,.14);
      box-shadow: 0 0 12px rgba(56,189,248,.2);
    }

    .results-meta {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 4px 16px; color: var(--muted); font-size: 0.88rem; flex-wrap: wrap; gap: 8px;
    }

    /* Grid for Mobile & Desktop */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px;
      padding-bottom: 60px;
    }

    /* Activity Card */
    .activity-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .activity-card:hover {
      border-color: rgba(56,189,248,.5);
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0,0,0,.5);
    }

    /* Visual Banner Header */
    .card-banner {
      height: 100px;
      position: relative;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 14px 18px;
      background-size: cover; background-position: center;
    }
    .card-banner.cat-Sightseeing { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
    .card-banner.cat-Culture     { background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%); }
    .card-banner.cat-Nature      { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
    .card-banner.cat-Adventure   { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
    .card-banner.cat-Experience  { background: linear-gradient(135deg, #db2777 0%, #be185d 100%); }

    .banner-icon {
      font-size: 2.2rem; filter: drop-shadow(0 2px 8px rgba(0,0,0,.4));
    }
    .city-chip {
      font-size: 0.76rem; color: #ffffff;
      background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.2);
      padding: 4px 10px; border-radius: 999px;
      font-weight: 600;
    }

    /* Selected State Glow & Highlights */
    .activity-card.selected {
      border-color: var(--success);
      box-shadow: 0 0 20px rgba(52,211,153,.3);
    }
    .selected-ribbon {
      position: absolute; top: 12px; left: 12px;
      background: var(--success); color: #064e3b;
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 4px 10px; border-radius: 999px;
      box-shadow: 0 2px 10px rgba(0,0,0,.4); display: none;
    }
    .activity-card.selected .selected-ribbon { display: inline-flex; align-items: center; gap: 4px; }

    .card-body {
      padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 12px;
    }

    .card-title-row {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .card-title-row h3 {
      font-size: 1.12rem; font-weight: 700; color: #f8fafc; line-height: 1.35;
    }

    .card-desc {
      color: var(--muted); font-size: 0.88rem; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-meta-pills {
      display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted);
      margin-top: 2px;
    }
    .meta-pill {
      background: var(--bg); border: 1px solid var(--border);
      padding: 4px 9px; border-radius: 6px; display: flex; align-items: center; gap: 4px;
    }

    .card-bottom {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .price-tag {
      font-size: 1.15rem; font-weight: 800; color: var(--success);
    }
    .price-tag.paid { color: var(--warning); }
    .price-tag sub { font-size: 0.72rem; font-weight: 400; color: var(--muted); }

    /* Interactive Add / Selected Button */
    .select-btn {
      padding: 10px 18px; border-radius: var(--radius-sm); border: none;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: all var(--transition);
      display: flex; align-items: center; gap: 6px;
    }
    .select-btn.unselected {
      background: rgba(56,189,248,.12); color: var(--primary); border: 1px solid rgba(56,189,248,.3);
    }
    .select-btn.unselected:hover {
      background: var(--primary); color: #0f172a; transform: scale(1.03);
    }
    .select-btn.selected {
      background: rgba(52,211,153,.2); color: var(--success); border: 1px solid rgba(52,211,153,.4);
    }
    .select-btn.selected:hover {
      background: rgba(248,113,113,.2); color: #f87171; border-color: rgba(248,113,113,.4);
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .controls-bar { flex-direction: column; }
      .controls-bar select { width: 100%; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="logo">🌍 GlobeTrotter</a>
    <nav>
      <a href="/static/dashboard.html">Dashboard</a>
      <a href="/static/create-trip.html">Plan New Trip</a>
      <a href="/static/activities.html" class="active">Activities</a>
      <a href="/static/itinerary.html">Itinerary</a>
      <a href="/static/budget.html">Budget</a>
    </nav>
  </nav>

  <div class="page">

    <!-- Page Header -->
    <div class="page-header">
      <h1>🗺️ Discover & Select <span>Activities</span></h1>
      <p>Browse experiences, filter by destination, and toggle activities for your itinerary.</p>
    </div>

    <!-- Search + Filter Controls Box -->
    <div class="controls-wrapper">
      <div class="controls-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍  Search activities or cities (e.g. Eiffel Tower, Paris, Museum...)"
          autocomplete="off"
        />
        <select id="categoryFilter">
          <option value="">🏷️ All Categories</option>
          <option value="Sightseeing">🏛️ Sightseeing</option>
          <option value="Culture">🎨 Culture</option>
          <option value="Nature">🌿 Nature</option>
          <option value="Adventure">⚡ Adventure</option>
          <option value="Experience">✨ Experience</option>
        </select>
      </div>

      <!-- City Quick Filter Tabs -->
      <div class="city-tabs" id="cityTabs">
        <button class="city-tab active" data-city="">🌐 All Cities</button>
        <button class="city-tab" data-city="Kashmir">🏔️ Kashmir</button>
        <button class="city-tab" data-city="Paris">🇫🇷 Paris</button>
        <button class="city-tab" data-city="Rome">🇮🇹 Rome</button>
        <button class="city-tab" data-city="Goa">🏖️ Goa</button>
        <button class="city-tab" data-city="Jaipur">🏰 Jaipur</button>
        <button class="city-tab" data-city="Tokyo">🇯🇵 Tokyo</button>
        <button class="city-tab" data-city="London">🇬🇧 London</button>
      </div>
    </div>

    <!-- Results Meta -->
    <div class="results-meta">
      <span id="countLabel">Loading activities...</span>
      <span id="targetTripLabel" style="font-size:0.82rem;color:var(--primary);font-weight:600"></span>
    </div>

    <!-- Activity Grid -->
    <div class="grid" id="grid"></div>

  </div><!-- /page -->

  <!-- Toast Notification -->
  <div id="toast"></div>

<script>
  /* ── State ── */
  let activeCity   = '';
  let activeTripId = 1;
  const selectedActivityIds = new Set();

  /* ── Elements ── */
  const grid      = document.getElementById('grid');
  const searchEl  = document.getElementById('searchInput');
  const catEl     = document.getElementById('categoryFilter');
  const countEl   = document.getElementById('countLabel');
  const tripLabel = document.getElementById('targetTripLabel');
  const toastEl   = document.getElementById('toast');

  /* Parse trip_id from URL */
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('trip_id')) {
    activeTripId = parseInt(urlParams.get('trip_id'), 10) || 1;
    tripLabel.textContent = `🎯 Selected Trip ID: #${activeTripId}`;
  }

  /* Fetch existing trip activities to pre-mark selected state */
  async function loadTripSelectionState() {
    try {
      const res  = await fetch(`/api/trips/${activeTripId}`);
      const json = await res.json();
      if (json.success && json.data && json.data.activities) {
        json.data.activities.forEach(a => selectedActivityIds.add(a.id || a.activity_id));
      }
    } catch(e) {}
  }

  /* ── City Tabs ── */
  document.querySelectorAll('.city-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.city-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCity = btn.dataset.city;
      loadActivities();
    });
  });

  /* ── Live Search & Filter ── */
  let debounceTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadActivities, 220);
  });
  catEl.addEventListener('change', loadActivities);

  /* Category Icons */
  function categoryIcon(cat) {
    const map = { Sightseeing: '🏛️', Culture: '🎨', Nature: '🌿', Adventure: '⚡', Experience: '✨' };
    return map[cat] || '📍';
  }

  /* Category Badge Class */
  function badgeClass(cat) {
    const map = { Sightseeing: 'badge-Sightseeing', Culture: 'badge-Culture', Nature: 'badge-Nature', Adventure: 'badge-Adventure', Experience: 'badge-Experience' };
    return map[cat] || 'badge-Sightseeing';
  }

  /* ── Skeleton Loading ── */
  function showSkeleton(n = 6) {
    grid.innerHTML = Array.from({length: n}, () => `
      <div class="activity-card">
        <div class="skeleton" style="height:100px;width:100%"></div>
        <div style="padding:18px">
          <div class="skeleton" style="height:22px;width:70%;margin-bottom:10px"></div>
          <div class="skeleton" style="height:14px;width:40%;margin-bottom:12px"></div>
          <div class="skeleton" style="height:44px;margin-bottom:14px"></div>
        </div>
      </div>
    `).join('');
  }

  /* ── Fetch activities from API ── */
  async function loadActivities() {
    showSkeleton();
    const q      = searchEl.value.trim();
    const cat    = catEl.value;
    const params = new URLSearchParams();
    if (activeCity) params.set('city',     activeCity);
    if (q)          params.set('q',        q);
    if (cat)        params.set('category', cat);

    try {
      const res  = await fetch(`/api/activities?${params}`);
      const json = await res.json();
      const list = json.data || [];
      countEl.textContent = `${list.length} activit${list.length !== 1 ? 'ies' : 'y'} available`;
      renderCards(list);
    } catch(err) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Could not connect to server</h3>
          <p>Make sure Flask server is running.</p>
        </div>`;
      countEl.textContent = '';
    }
  }

  /* ── Render Activity Cards ── */
  function renderCards(list) {
    if (!list.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔭</div>
          <h3>No activities found</h3>
          <p>Try broadening your search term or category filter.</p>
        </div>`;
      return;
    }

    grid.innerHTML = list.map(a => {
      const isSelected = selectedActivityIds.has(a.id);
      const isFree     = a.cost === 0;

      return `
        <div class="activity-card ${isSelected ? 'selected' : ''}" id="card-${a.id}">

          <div class="selected-ribbon">✓ Selected</div>

          <!-- Banner Header with Destination Photo -->
          <div class="card-banner cat-${a.category}" style="${a.image_url ? `background: url('${a.image_url}') center/cover no-repeat; height:130px; position:relative;` : ''}">
            ${a.image_url ? `<div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(9,13,22,0.92), rgba(9,13,22,0.2));"></div>` : ''}
            <span class="banner-icon" style="position:relative;z-index:2">${categoryIcon(a.category)}</span>
            <span class="city-chip" style="position:relative;z-index:2">📍 ${escHtml(a.city)}</span>
          </div>

          <div class="card-body">

            <div class="card-title-row">
              <h3>${escHtml(a.name)}</h3>
              <span class="badge ${badgeClass(a.category)}">${escHtml(a.category)}</span>
            </div>

            <p class="card-desc">${escHtml(a.description || 'Explore local landmark experiences and culture.')}</p>

            <div class="card-meta-pills">
              <div class="meta-pill">⏱ ${escHtml(a.duration)}</div>
              ${a.preferred_time ? `<div class="meta-pill">🕒 ${escHtml(a.preferred_time)}</div>` : ''}
            </div>

            <div class="card-bottom">
              <div class="price-tag ${isFree ? '' : 'paid'}">
                ${isFree ? '<span style="color:var(--success)">FREE</span>' : `$${a.cost.toFixed(2)} <sub>per person</sub>`}
              </div>

              <button
                class="select-btn ${isSelected ? 'selected' : 'unselected'}"
                id="btn-${a.id}"
                onclick="toggleActivitySelection(${a.id}, \`${escJs(a.name)}\`)"
              >
                ${isSelected ? '✓ Selected' : '＋ Add Activity'}
              </button>
            </div>

          </div><!-- /card-body -->

        </div>
      `;
    }).join('');
  }

  /* ── Toggle Activity Selection (Add / Remove) ── */
  async function toggleActivitySelection(id, name) {
    const card = document.getElementById(`card-${id}`);
    const btn  = document.getElementById(`btn-${id}`);
    if (!btn) return;

    const isCurrentlySelected = selectedActivityIds.has(id);
    btn.disabled = true;
    btn.textContent = '⏳ Updating...';

    if (!isCurrentlySelected) {
      // Add Activity
      try {
        const res = await fetch(`/api/trips/${activeTripId}/activities`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activity_id: id, day_number: 1 })
        });
        const json = await res.json();

        if (json.success) {
          selectedActivityIds.add(id);
          card.classList.add('selected');
          btn.className = 'select-btn selected';
          btn.textContent = '✓ Selected';
          btn.disabled = false;
          showToast(`✅ "${name}" added to trip!`, 'green');
        } else {
          btn.className = 'select-btn unselected';
          btn.textContent = '＋ Add Activity';
          btn.disabled = false;
          showToast('❌ ' + json.message, 'red');
        }
      } catch(e) {
        btn.className = 'select-btn unselected';
        btn.textContent = '＋ Add Activity';
        btn.disabled = false;
        showToast('❌ Server error adding activity.', 'red');
      }
    } else {
      // Remove Activity
      try {
        const res = await fetch(`/api/trips/${activeTripId}/activities/${id}`, {
          method: 'DELETE'
        });
        const json = await res.json();

        if (json.success) {
          selectedActivityIds.delete(id);
          card.classList.remove('selected');
          btn.className = 'select-btn unselected';
          btn.textContent = '＋ Add Activity';
          btn.disabled = false;
          showToast(`✅ Removed "${name}"`, 'green');
        } else {
          btn.className = 'select-btn selected';
          btn.textContent = '✓ Selected';
          btn.disabled = false;
          showToast('❌ ' + json.message, 'red');
        }
      } catch(e) {
        btn.className = 'select-btn selected';
        btn.textContent = '✓ Selected';
        btn.disabled = false;
        showToast('❌ Server error removing activity.', 'red');
      }
    }
  }

  /* ── Toast ── */
  let toastTimer;
  function showToast(msg, type = 'green') {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.className   = `show ${type}`;
    toastTimer = setTimeout(() => { toastEl.className = ''; }, 3000);
  }

  /* ── Helpers ── */
  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escJs(str) {
    return String(str || '').replace(/\\/g,'\\\\').replace(/`/g,'\\`');
  }

  /* ── Init ── */
  (async () => {
    await loadTripSelectionState();
    await loadActivities();
  })();
</script>

</body>
</html>
