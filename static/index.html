<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobeTrotter — Smart Travel Planner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 480px;
    }
    .globe { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 2rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    p  { color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .api-hint {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #475569;
    }
    .api-hint a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="globe">🌍</div>
    <h1>GlobeTrotter</h1>
    <p>Smart Travel Planning — Odoo x LDCE Hackathon 2026</p>
    <span class="badge">✅ Server is running</span>
    <div class="api-hint">
      API health: <a href="/api/health" target="_blank">/api/health</a>
    </div>
  </div>
</body>
</html>
