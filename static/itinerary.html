<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GlobeTrotter Day-Wise Itinerary — Executive visual travel timeline."/>
  <title>Executive Travel Itinerary Timeline — GlobeTrotter</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    /* ── Executive Visual Itinerary Polish (M4 Turn 4) ── */
    .itin-wrapper {
      max-width: 980px;
      margin: 32px auto 90px;
      padding: 0 20px;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 600;
      transition: color var(--transition);
    }
    .back-btn:hover { color: var(--primary); }

    /* Executive Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #090d16 0%, #1e293b 60%, #0f172a 100%);
      border: 1px solid rgba(56,189,248,.3);
      border-radius: 24px;
      padding: 36px 40px;
      margin-bottom: 36px;
      box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
      position: relative; overflow: hidden;
    }
    .hero-banner::after {
      content: '✨';
      position: absolute; right: 28px; bottom: 8px;
      font-size: 8rem; opacity: 0.08; pointer-events: none;
    }

    .hero-title-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 16px; margin-bottom: 16px;
    }
    .hero-title { font-size: 2.3rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }

    .cost-hero-box {
      background: rgba(52,211,153,.1);
      border: 1px solid rgba(52,211,153,.3);
      padding: 10px 20px; border-radius: 16px; text-align: right;
    }
    .cost-hero-label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.8px; font-weight: 700; }
    .cost-hero-val   { font-size: 1.6rem; font-weight: 800; color: var(--success); }

    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px; margin-top: 24px;
    }
    .sum-card {
      background: rgba(15,23,42,.6); backdrop-filter: blur(8px);
      border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .sum-icon { font-size: 1.6rem; }
    .sum-val  { font-size: 1.1rem; font-weight: 800; color: #f8fafc; }
    .sum-lbl  { font-size: 0.76rem; color: var(--muted); font-weight: 600; }

    /* Day Card Container */
    .day-container { margin-bottom: 48px; }

    /* Day Header Divider */
    .day-header {
      background: linear-gradient(90deg, #1e293b 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      border-left: 6px solid var(--primary);
      border-radius: 18px;
      padding: 18px 24px;
      margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    .day-header.cat-culture { border-left-color: #a855f7; }
    .day-header.cat-nature  { border-left-color: #34d399; }

    .day-tag {
      background: var(--primary); color: #0f172a;
      font-weight: 800; font-size: 0.85rem; padding: 4px 12px;
      border-radius: 999px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    .day-city-title { font-size: 1.35rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .day-date-badge {
      font-size: 0.86rem; color: var(--accent); font-weight: 700;
      background: rgba(56,189,248,.1); border: 1px solid rgba(56,189,248,.25);
      padding: 4px 12px; border-radius: 999px;
    }

    /* Vertical Timeline Connector */
    .timeline {
      position: relative;
      padding-left: 42px;
    }
    .timeline::before {
      content: '';
      position: absolute; left: 18px; top: 12px; bottom: 12px;
      width: 3px;
      background: linear-gradient(180deg, var(--primary) 0%, #a855f7 50%, var(--success) 100%);
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(56,189,248,.4);
    }

    /* Node Item */
    .timeline-item {
      position: relative; margin-bottom: 24px;
    }
    .timeline-item:last-child { margin-bottom: 0; }

    /* Node Marker Badge */
    .node-icon-badge {
      position: absolute; left: -42px; top: 16px;
      width: 32px; height: 32px; border-radius: 50%;
      background: #0f172a; border: 2px solid var(--primary);
      box-shadow: 0 0 14px rgba(56,189,248,.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; z-index: 2;
    }

    /* Node Activity Card */
    .act-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 18px;
      padding: 22px 26px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 20px; flex-wrap: wrap;
      transition: all var(--transition);
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    .act-card:hover {
      border-color: rgba(56,189,248,.5);
      transform: translateX(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    .act-card.cat-Culture    { border-left-color: #a855f7; }
    .act-card.cat-Nature     { border-left-color: #34d399; }
    .act-card.cat-Adventure  { border-left-color: #fbbf24; }
    .act-card.cat-Experience { border-left-color: #f472b6; }

    .act-main-info {
      display: flex; align-items: flex-start; gap: 16px; flex: 1; min-width: 280px;
    }

    .time-chip {
      background: rgba(56,189,248,.12); color: var(--primary);
      border: 1px solid rgba(56,189,248,.3);
      font-size: 0.9rem; font-weight: 800;
      padding: 8px 14px; border-radius: 12px;
      white-space: nowrap; flex-shrink: 0;
    }

    .act-body h4 {
      font-size: 1.15rem; font-weight: 800; color: #ffffff; margin-bottom: 6px; line-height: 1.3;
    }
    .act-body p {
      font-size: 0.88rem; color: var(--muted); line-height: 1.5; margin-bottom: 10px;
    }

    .pills-row {
      display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.8rem;
    }
    .pill {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--muted); padding: 4px 10px; border-radius: 8px;
      display: inline-flex; align-items: center; gap: 5px; font-weight: 600;
    }

    .act-cost-box {
      text-align: right; flex-shrink: 0;
    }
    .cost-val {
      font-size: 1.25rem; font-weight: 800; color: var(--success);
    }
    .cost-val.paid { color: var(--warning); }
    .cost-sub { font-size: 0.72rem; color: var(--muted); }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .hero-banner { padding: 24px 20px; }
      .hero-title { font-size: 1.7rem; }
      .timeline { padding-left: 28px; }
      .timeline::before { left: 12px; }
      .node-icon-badge { left: -28px; width: 26px; height: 26px; font-size: 0.8rem; }
      .act-card { padding: 16px; flex-direction: column; align-items: flex-start; }
      .act-cost-box { text-align: left; width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    }

    /* Print styling */
    @media print {
      body { background: #fff; color: #000; }
      .navbar, .top-bar, .no-print { display: none !important; }
      .itin-wrapper { max-width: 100%; margin: 0; padding: 0; }
      .hero-banner { background: #f8fafc; border: 1px solid #ccc; color: #000; }
      .hero-title { color: #000; }
      .act-card { border: 1px solid #ccc; background: #fff; color: #000; box-shadow: none; }
      .act-body h4 { color: #000; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="logo">🌍 GlobeTrotter</a>
    <nav>
      <a href="/static/dashboard.html">Dashboard</a>
      <a href="/static/create-trip.html">Plan New Trip</a>
      <a href="/static/activities.html">Activities</a>
      <a href="/static/itinerary.html" class="active">Itinerary</a>
      <a href="/static/budget.html">Budget</a>
    </nav>
  </nav>

  <div class="itin-wrapper">

    <div class="top-bar">
      <a href="/static/dashboard.html" class="back-btn">← Back to Dashboard</a>
      <div class="no-print" style="display:flex;gap:10px">
        <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ Print / PDF</button>
        <a id="editTripLink" href="#" class="btn btn-primary btn-sm">✏️ Edit Trip Details</a>
      </div>
    </div>

    <!-- Executive Hero Banner -->
    <div class="hero-banner" id="heroBanner">
      <div class="skeleton" style="height:36px;width:60%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:20px;width:40%"></div>
    </div>

    <!-- Day-Wise Timeline Container -->
    <div id="timelineContainer">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <h3>Building day-wise travel timeline...</h3>
      </div>
    </div>

  </div>

<script>
  let currentTripId = 1;

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('trip_id') || urlParams.has('id')) {
    currentTripId = parseInt(urlParams.get('trip_id') || urlParams.get('id'), 10) || 1;
  }
  document.getElementById('editTripLink').href = `/static/trip-details.html?id=${currentTripId}`;

  async function loadDayWiseItinerary() {
    try {
      const res = await fetch(`/api/trips/${currentTripId}/itinerary`);
      const json = await res.json();

      if (!json.success || !json.data) {
        showError('Trip itinerary not found.');
        return;
      }

      renderHeroBanner(json.data);
      renderDayWiseTimeline(json.data);

    } catch(e) {
      showError('Failed to connect to server.');
    }
  }

  function getCategoryEmoji(cat) {
    const map = { Sightseeing: '🏛️', Culture: '🎨', Nature: '🌿', Adventure: '⚡', Experience: '✨' };
    return map[cat] || '📍';
  }

  function renderHeroBanner(data) {
    const items     = data.chronological || [];
    const totalCost = items.reduce((sum, item) => sum + (item.cost || 0), 0);
    const actCount  = items.length;
    const citiesSet = new Set(items.map(i => i.city));

    let durationText = 'Flexible Duration';
    if (data.start_date && data.end_date) {
      const start = new Date(data.start_date);
      const end   = new Date(data.end_date);
      const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays > 0) durationText = `${diffDays} Days`;
    }

    document.getElementById('heroBanner').innerHTML = `
      <div class="hero-title-row">
        <div>
          <span class="badge badge-Sightseeing" style="margin-bottom:8px">✈️ Official Itinerary</span>
          <h1 class="hero-title">${escHtml(data.trip_title)}</h1>
          <p style="color:var(--muted);font-size:0.95rem">
            Day-by-Day Chronological Itinerary & Activity Timeline
          </p>
        </div>

        <div class="cost-hero-box">
          <div class="cost-hero-label">Total Estimated Budget</div>
          <div class="cost-hero-val">${totalCost > 0 ? '$' + totalCost.toFixed(2) : 'FREE'}</div>
        </div>
      </div>

      <div class="summary-grid">
        <div class="sum-card">
          <div class="sum-icon">📅</div>
          <div>
            <div class="sum-val">${escHtml(data.start_date || 'Flexible')}</div>
            <div class="sum-lbl">Start Date</div>
          </div>
        </div>

        <div class="sum-card">
          <div class="sum-icon">⏱</div>
          <div>
            <div class="sum-val">${durationText}</div>
            <div class="sum-lbl">Trip Duration</div>
          </div>
        </div>

        <div class="sum-card">
          <div class="sum-icon">🏙️</div>
          <div>
            <div class="sum-val">${citiesSet.size} City Stop${citiesSet.size !== 1 ? 's' : ''}</div>
            <div class="sum-lbl">Destinations</div>
          </div>
        </div>

        <div class="sum-card">
          <div class="sum-icon">🎟️</div>
          <div>
            <div class="sum-val">${actCount} Activity${actCount !== 1 ? 'ies' : ''}</div>
            <div class="sum-lbl">Scheduled</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderDayWiseTimeline(data) {
    const container = document.getElementById('timelineContainer');
    const itinerary = data.itinerary || [];

    if (!itinerary.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔭</div>
          <h3>No activities scheduled for this trip yet</h3>
          <p>Browse destinations and discover activities to automatically build your day-wise timeline.</p>
          <a href="/static/activities.html?trip_id=${currentTripId}" class="btn btn-primary" style="margin-top:16px">＋ Discover & Add Activities</a>
        </div>`;
      return;
    }

    let dayNum = 1;
    container.innerHTML = itinerary.map(dayBlock => {
      const dateStr = dayBlock.date;
      const cities  = dayBlock.cities || [];

      return cities.map(cityBlock => {
        const cityName = cityBlock.city;
        const acts     = cityBlock.activities || [];
        const currentDay = dayNum++;

        return `
          <div class="day-container">
            <!-- Day & City Header -->
            <div class="day-header cat-${(acts[0] && acts[0].category) || 'Sightseeing'}">
              <div class="day-city-title">
                <span class="day-tag">DAY ${currentDay}</span>
                <span>📍 ${escHtml(cityName)}</span>
              </div>
              <div class="day-date-badge">🗓️ ${escHtml(dateStr)}</div>
            </div>

            <!-- Timeline -->
            <div class="timeline">
              ${acts.map(a => `
                <div class="timeline-item">
                  <div class="node-icon-badge">${getCategoryEmoji(a.category)}</div>

                  <div class="act-card cat-${a.category}">
                    <div class="act-main-info">
                      <div class="time-chip">🕒 ${escHtml(a.time || '09:00 AM')}</div>

                      <div class="act-body">
                        <h4>${escHtml(a.name)}</h4>
                        ${a.description ? `<p>${escHtml(a.description)}</p>` : ''}

                        <div class="pills-row">
                          <div class="pill">⏱ ${escHtml(a.duration)}</div>
                          <div class="pill">🏷️ ${escHtml(a.category)}</div>
                          ${a.notes ? `<div class="pill">📝 ${escHtml(a.notes)}</div>` : ''}
                        </div>
                      </div>
                    </div>

                    <div class="act-cost-box">
                      <div class="cost-val ${a.cost > 0 ? 'paid' : ''}">
                        ${a.cost > 0 ? '$' + a.cost.toFixed(2) : 'FREE'}
                      </div>
                      <div class="cost-sub">${a.cost > 0 ? 'per person' : 'no fee'}</div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }).join('');
  }

  function showError(msg) {
    document.getElementById('timelineContainer').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h3>${msg}</h3>
        <a href="/static/dashboard.html" class="btn btn-outline" style="margin-top:14px">Go to Dashboard</a>
      </div>`;
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadDayWiseItinerary();
</script>

</body>
</html>
